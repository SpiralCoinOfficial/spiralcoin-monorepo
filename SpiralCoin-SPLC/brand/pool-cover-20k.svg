<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SpiralCoin SPLC/USDC Liquidity Pool Seed — $20,000 goal">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#10243e"/>
      <stop offset="55%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d97a"/>
      <stop offset="50%" stop-color="#f0c84a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe79b"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="usdc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b8df0"/>
      <stop offset="100%" stop-color="#1656c2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(240,200,74,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- decorative spiral arcs (subtle galaxy nod) -->
  <g opacity="0.18" stroke="url(#gold)" stroke-width="1.2" fill="none">
    <ellipse cx="600" cy="315" rx="540" ry="220" transform="rotate(-12 600 315)"/>
    <ellipse cx="600" cy="315" rx="440" ry="170" transform="rotate(-12 600 315)"/>
    <ellipse cx="600" cy="315" rx="340" ry="120" transform="rotate(-12 600 315)"/>
  </g>

  <!-- top eyebrow -->
  <g transform="translate(600 90)" text-anchor="middle">
    <rect x="-115" y="-22" width="230" height="34" rx="17" fill="rgba(240,200,74,0.08)" stroke="rgba(240,200,74,0.45)"/>
    <text y="2" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" letter-spacing="3.5" font-weight="700" fill="#f0c84a">ARBITRUM • UNISWAP V3</text>
  </g>

  <!-- token pair circles -->
  <g transform="translate(600 250)" filter="url(#glow)">
    <!-- SPLC -->
    <circle cx="-55" cy="0" r="62" fill="url(#gold)"/>
    <text x="-55" y="9" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#0a0d1a">SPLC</text>
    <!-- USDC -->
    <circle cx="55" cy="0" r="62" fill="url(#usdc)" stroke="#9fc3ff" stroke-width="2"/>
    <text x="55" y="10" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#ffffff">USDC</text>
  </g>

  <!-- headline -->
  <g text-anchor="middle" font-family="Georgia,serif">
    <text x="600" y="380" font-size="58" font-weight="700" fill="url(#goldText)">SPLC / USDC Liquidity Pool</text>
    <text x="600" y="430" font-size="26" font-weight="400" fill="#cfd6e0" font-family="-apple-system,Segoe UI,Roboto,sans-serif">Seed Round — Bootstrapping the AMM venue on Arbitrum One</text>
  </g>

  <!-- goal pill -->
  <g transform="translate(600 495)" text-anchor="middle">
    <rect x="-185" y="-38" width="370" height="76" rx="38" fill="rgba(240,200,74,0.10)" stroke="url(#gold)" stroke-width="2"/>
    <text y="-4" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" letter-spacing="3" font-weight="700" fill="#f0c84a">GOAL</text>
    <text y="32" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="40" font-weight="800" fill="#ffffff">$20,000 USDC</text>
  </g>

  <!-- feature row -->
  <g transform="translate(0 580)" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#9fb3c8">
    <text x="240">12-MONTH LP TIME-LOCK</text>
    <text x="600">FULL-RANGE V3 POSITION</text>
    <text x="960">ON-CHAIN VERIFIABLE</text>
  </g>

  <!-- spiralcoin.net wordmark bottom right -->
  <text x="1170" y="612" text-anchor="end" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" letter-spacing="3" font-weight="700" fill="rgba(240,200,74,0.55)">SPIRALCOIN.NET</text>
</svg>
