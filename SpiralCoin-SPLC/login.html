<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Sign in — SpiralCoin</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/brand/splc-logo-64.png" />
    <meta name="description"
        content="Sign in to SpiralCoin to access your trading dashboard, portfolio, and SPLC governance tools." />
    <style>
        :root {
            --gold: #d4af37
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 20%, #1a1330 0%, #0a0a14 60%);
            color: #e8e8f0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif
        }

        .card {
            width: min(420px, 90vw);
            background: rgba(20, 20, 32, .85);
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 36px;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, .4)
        }

        .logo {
            display: block;
            margin: 0 auto 16px;
            width: 72px;
            height: 72px
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700
        }

        .sub {
            text-align: center;
            color: #9999b3;
            font-size: 14px;
            margin: 0 0 28px
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 16px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .08s ease, box-shadow .15s ease
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, .3)
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #0a0a14
        }

        .btn-ghost {
            background: transparent;
            color: #e8e8f0;
            border: 1px solid #3a3a4a
        }

        .btn-github {
            background: #24292e;
            color: #fff
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a3a
        }

        .legal {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 24px
        }

        .legal a {
            color: #9999b3
        }
    </style>
</head>

<body>
    <main class="card">
        <img class="logo" src="/brand/splc-logo-128.png" alt="SpiralCoin" />
        <h1>Sign in to SpiralCoin</h1>
        <p class="sub">Trading involves risk. Past performance does not guarantee future results.</p>

        <button class="btn btn-gold" id="btnSignup">Create Account</button>
        <button class="btn btn-ghost" id="btnLogin">Log In with Email</button>
        <div class="divider">or</div>
        <button class="btn btn-github" id="btnGithub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.16c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.06 11.06 0 015.78 0c2.21-1.49 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.26 5.68.41.35.78 1.04.78 2.09v3.1c0 .31.21.67.8.56 4.57-1.52 7.86-5.83 7.86-10.91C23.5 5.65 18.35.5 12 .5z" />
            </svg>
            Continue with GitHub
        </button>

        <p class="legal">
            By continuing you agree to our
            <a href="/regd.html">terms</a> and acknowledge our
            <a href="/cookies.html">cookie policy</a>.
        </p>
    </main>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
    <script src="/assets/js/auth0-client.js?v=20260528a"></script>
    <script>
        document.getElementById('btnLogin').addEventListener('click', () => SPLCAuth.login());
        document.getElementById('btnSignup').addEventListener('click', () => SPLCAuth.signup());
        document.getElementById('btnGithub').addEventListener('click', () => SPLCAuth.loginWithGithub());
        // If already signed in, bounce home
        (async () => { if (await SPLCAuth.isAuthenticated()) location.replace('/'); })();
    </script>
</body>

</html>
